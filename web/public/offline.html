<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#160847" />
    <title>You’re offline | KAAM</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(2rem + env(safe-area-inset-top)) calc(1.25rem + env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) calc(1.25rem + env(safe-area-inset-left));font-family:system-ui,-apple-system,sans-serif;background:#160847;color:#fff;text-align:center}.card{width:min(100%,30rem);padding:2rem;border:1px solid rgb(255 255 255/.18);border-radius:1rem;background:rgb(255 255 255/.08)}img{width:min(15rem,75%);height:auto}h1{margin:1.5rem 0 .5rem;font-size:clamp(1.6rem,7vw,2.25rem)}p{margin:0 auto 1.5rem;max-width:25rem;line-height:1.6;color:#eee8fa}button{min-height:3rem;border:0;border-radius:.75rem;padding:.75rem 1.25rem;background:#f56ba1;color:#160847;font:inherit;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/kaam-logo.webp" alt="KAAM – Perfect Match" />
      <h1>You’re offline</h1>
      <p>Check your internet connection and try again. Jobs, messages, documents, profiles, and payments need a live connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>window.addEventListener("online",function(){window.location.reload()})</script>
  </body>
</html>
